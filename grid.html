<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grid</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="process_log.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <nav id="mainNav"></nav>
    <button id="statsButton">Stats</button>
    <h1 id="title"></h1>
    <div id="stats">
        <h1 id="statsTitle">Activities</h1>
        <div id="activities">
        </div>
    </div>
    <div>
        <form action="" id="logForm">
            <label for="logInput" id="logLabel" hidden>Select log file</label>
            <input type="file" accept=".txt, .log" id="logInput" name="log" hidden>
        </form>
        <div id="gridBackground"></div>
        <div id="grid"></div>
    </div>
    <div id="tooltip"></div>
    <div id="eventBox">
        <h1 id="events"></h1>
    </div>
</body>
</html>
