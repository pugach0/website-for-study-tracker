<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grid</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="process_log.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <nav id="mainNav"></nav>
    <button id="statsButton">Stats</button>
    <div id="monthCycleBox">
        <button id="monthCycleBackward" class="monthSwitch">&lt;</button>
        <h1 id="title"></h1>
        <button id="monthCycleForward" class="monthSwitch">&gt;</button>
    </div>
    <div id="stats" class="hidden">
        <h1 id="totalHoursCounted"></h1>
        <div id="tabSwitchBox">
            <button class="tabSwitch" id="tabTotalSwitch">Total</button>
            <button class="tabSwitch" id="tabYearSwitch">Year</button>
            <button class="tabSwitch" id="tabMonthSwitch">Month</button>
            <button class="tabSwitch" id="tabWeekSwitch">Week</button>
        </div>
        <h1 id="statsTitle">Total</h1>
        <div id="activities">
        </div>
    </div>
    <div>
        <form action="" id="logForm">
            <div id="logInfo"><h1 id="logInfoText">i</h1></div>
            <label for="logInput" id="logLabel" hidden>Select log file</label>
            <input type="file" accept=".txt, .log" id="logInput" name="log" hidden>
        </form>
        <div id="gridBackground"></div>
        <div id="fullGrid">
            <div id="weekDays">
                <h1 class="weekDay">Mon</h1>
                <h1 class="weekDay">Tue</h1>
                <h1 class="weekDay">Wed</h1>
                <h1 class="weekDay">Thu</h1>
                <h1 class="weekDay">Fri</h1>
                <h1 class="weekDay">Sat</h1>
                <h1 class="weekDay">Son</h1>
            </div>
            <div id="grid"></div>
        </div>
    </div>
    <div id="tooltip"></div>
    <div id="eventBox">
        <h1 id="events"></h1>
    </div>
</body>
</html>
